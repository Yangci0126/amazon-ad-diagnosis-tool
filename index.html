<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亚马逊广告诊断工具</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#faf6ff; --bg-grad:linear-gradient(160deg,#faf6ff 0%,#fff0f7 45%,#f0f7ff 100%);
    --card:#ffffff; --text:#2a2140; --muted:#8b7fa3; --line:#efe7f7;
    --primary:#7c5cff; --pink:#ff5ca8; --orange:#ff9f43; --blue:#4aa8ff;
    --teal:#2ec4b6; --yellow:#f2b705; --green:#3ecf6e; --red:#ff5c5c; --purple:#a55cff;
    --shadow:0 6px 24px rgba(124,92,255,.08);
    --thead:#fbf8ff;
  }
  [data-theme="dark"]{
    --bg:#14101d; --bg-grad:linear-gradient(160deg,#14101d 0%,#1c1226 50%,#0f1626 100%);
    --card:#221a30; --text:#f0e9fa; --muted:#9b8db0; --line:#352a47;
    --primary:#9d82ff; --pink:#ff7ab8; --orange:#ffb35c; --blue:#6cb5ff;
    --teal:#4fd6c9; --yellow:#ffd45c; --green:#5ce08a; --red:#ff7a7a; --purple:#bc8cff;
    --shadow:0 6px 24px rgba(0,0,0,.35);
    --thead:#2a2038;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-grad);background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.6}
  .wrap{max-width:1320px;margin:0 auto;padding:24px 20px 60px}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--pink));display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:var(--shadow)}
  h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}

  .btn{height:38px;padding:0 18px;border:none;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;transition:transform .06s,filter .15s}
  .btn:active{transform:scale(.97)}
  .btn-icon{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:20px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--pink));color:#fff;box-shadow:var(--shadow)}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .panel h2{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h2 .emoji{font-size:18px}

  .upload-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .upload-zone{flex:1;min-width:260px;border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
  .upload-zone:hover{border-color:var(--primary);color:var(--primary);background:var(--bg)}
  .upload-zone.has-file{border-style:solid;border-color:var(--green);color:var(--green)}
  .file-hint{font-size:12px;color:var(--muted);margin-top:10px}

  .kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .kpi-item{border-radius:16px;padding:14px 16px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
  .kpi-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px}
  .kpi-item .label{font-size:12px;color:var(--muted)}
  .kpi-item .val{font-size:22px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .kpi-item.c0::before{background:var(--pink)} .kpi-item.c1::before{background:var(--orange)}
  .kpi-item.c2::before{background:var(--blue)} .kpi-item.c3::before{background:var(--teal)}
  .kpi-item.c4::before{background:var(--yellow)} .kpi-item.c5::before{background:var(--green)}
  .kpi-item.c6::before{background:var(--primary)} .kpi-item.c7::before{background:var(--red)}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:8px 18px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:var(--card);font-size:13px;color:var(--muted);font-weight:600;transition:.15s}
  .tab:hover{color:var(--primary);border-color:var(--primary)}
  .tab.active{background:linear-gradient(135deg,var(--primary),var(--pink));color:#fff;border-color:transparent}

  .filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:12px;background:var(--bg);border-radius:14px}
  .filterbar select,.filterbar input{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:13px;background:var(--card);color:var(--text)}
  .filterbar select{width:150px;min-width:150px}
  .filterbar select:focus,.filterbar input:focus{outline:none;border-color:var(--primary)}
  .filterbar input.search{flex:1;min-width:160px}
  .fgroup{display:flex;align-items:center;gap:6px}
  .fgroup .flabel{font-size:12px;color:var(--muted);white-space:nowrap;width:52px;text-align:right}

  .table-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  #rowCount{color:var(--muted);font-size:13px}

  .table-wrap{overflow:auto;max-height:660px;border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{position:sticky;top:0;background:var(--thead);border-bottom:1px solid var(--line);padding:11px 12px;text-align:right;white-space:nowrap;cursor:pointer;user-select:none;font-weight:600;color:var(--text);z-index:2}
  thead th:first-child{text-align:left}
  thead th .arrow{font-size:10px;color:var(--primary)}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
  tbody td:first-child{text-align:left}
  tbody tr:hover{background:var(--bg)}
  td.kw{max-width:380px;white-space:normal;line-height:1.45;vertical-align:middle}
  td.mt{white-space:nowrap}
  .kw-name{font-weight:600;margin-bottom:4px}
  .kw-tags{margin-bottom:3px}
  .kw-advice{color:var(--muted);font-size:12px;min-height:17px}
  .clamp1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

  .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;white-space:nowrap;font-weight:600}
  .tag+.tag{margin-left:5px}
  .tag-insufficient{background:rgba(139,127,163,.14);color:var(--muted)}
  .tag-excellent{background:rgba(62,207,110,.16);color:var(--green)}
  .tag-optimize{background:rgba(242,183,5,.16);color:#c78a00}
  [data-theme="dark"] .tag-optimize{color:var(--yellow)}
  .tag-urgent{background:rgba(255,92,92,.16);color:var(--red)}
  .tag-potential{background:rgba(165,92,255,.16);color:var(--purple)}
  .tag-inefficient{background:rgba(255,92,92,.2);color:var(--red)}

  .empty{padding:40px;text-align:center;color:var(--muted)}

  .modal-mask{position:fixed;inset:0;background:rgba(20,10,30,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-mask.show{display:flex}
  .modal{background:var(--card);border-radius:22px;padding:24px;width:360px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
  .modal h3{font-size:16px;font-weight:700;margin-bottom:18px}
  .modal .field{margin-bottom:14px}
  .modal .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .modal .field input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;background:var(--bg);color:var(--text)}
  .modal .field input:focus{outline:none;border-color:var(--primary)}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;margin-bottom:14px}
  .switch{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:.2s}
  .switch.on{background:linear-gradient(135deg,var(--primary),var(--pink))}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on::after{left:23px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🎯</div>
      <div>
        <h1>亚马逊广告诊断工具</h1>
        <div class="sub">上传搜索词报告 · 自动聚合 · 打标签 · 输出优化建议</div>
      </div>
    </div>
    <button class="btn-icon" id="settingsBtn" title="设置">⚙️</button>
  </header>

  <section class="panel">
    <h2><span class="emoji">📤</span> 上传数据</h2>
    <div class="upload-row">
      <div class="upload-zone" id="uploadZone">
        <div>点击选择或拖拽 <b>.xlsx</b> 文件</div>
        <div style="font-size:12px;margin-top:4px" id="fileName">尚未选择文件</div>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    </div>
    <div class="file-hint">格式固定：需含「广告组合名称 / 广告活动名称 / 广告组名称 / 投放 / 匹配类型 / 客户搜索词 / 展示量 / 点击量 / 花费 / 7天总销售额 / 7天总销售量」列 · 数据仅在浏览器本地处理</div>
  </section>

  <section class="panel" id="overviewPanel" style="display:none">
    <h2><span class="emoji">📊</span> 数据概览</h2>
    <div class="kpi" id="kpiBox"></div>
  </section>

  <section class="panel" id="detailPanel" style="display:none">
    <h2><span class="emoji">🔍</span> 诊断明细</h2>
    <div class="tabs" id="tabs"></div>
    <div class="filterbar">
      <div class="fgroup"><span class="flabel">广告组合</span><select id="fPortfolio"><option value="">全部</option></select></div>
      <div class="fgroup"><span class="flabel">广告活动</span><select id="fCampaign"><option value="">全部</option></select></div>
      <div class="fgroup"><span class="flabel">广告组</span><select id="fAdGroup"><option value="">全部</option></select></div>
      <div class="fgroup"><span class="flabel">投放</span><select id="fTargeting"><option value="">全部</option></select></div>
      <div class="fgroup"><span class="flabel">标签</span><select id="fTag"><option value="">全部标签</option></select></div>
      <input class="search" id="searchBox" placeholder="🔎 搜索关键词 / 名称…">
    </div>
    <div class="table-toolbar">
      <span id="rowCount"></span>
      <button class="btn btn-ghost" id="exportBtn" disabled>⬇️ 导出 CSV</button>
    </div>
    <div class="table-wrap">
      <table id="dataTable">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="modal-mask" id="settingsModal">
  <div class="modal">
    <h3>⚙️ 设置</h3>
    <div class="field"><label>样本点击数量（建议 10）</label><input type="number" id="sSampleClicks" min="0"></div>
    <div class="field"><label>红线点击数量</label><input type="number" id="sRedClicks" min="0"></div>
    <div class="field"><label>目标 ACOS（%）</label><input type="number" id="sTargetAcos" min="0" step="0.1"></div>
    <div class="field"><label>红线 ACOS（%）</label><input type="number" id="sRedAcos" min="0" step="0.1"></div>
    <div class="switch-row">
      <span>🌙 暗黑模式</span>
      <div class="switch" id="darkSwitch"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="settingsCancel">取消</button>
      <button class="btn btn-primary" id="settingsApply">应用</button>
    </div>
  </div>
</div>

<script>
const FIELD_MAP = {
  '广告组合名称':'portfolio','广告活动名称':'campaign','广告组名称':'adGroup','投放':'targeting',
  '匹配类型':'matchType','客户搜索词':'keyword','展示量':'impressions','点击量':'clicks',
  '花费':'spend','7天总销售额':'sales','7天总销售量':'units','7天总订单数':'orders'
};
function normHeader(h){ return String(h).replace(/[()#\s\u3000]/g,''); }

const DIMENSIONS = [
  { key:'keyword',   label:'客户搜索词', field:'keyword' },
  { key:'targeting', label:'投放',      field:'targeting' },
  { key:'adGroup',   label:'广告组',    field:'adGroup' },
  { key:'campaign',  label:'广告活动',  field:'campaign' },
  { key:'portfolio', label:'广告组合',  field:'portfolio' }
];
const TAG_META = {
  insufficient:{label:'数据量不足',cls:'insufficient'}, excellent:{label:'优秀',cls:'excellent'},
  optimize:{label:'有待优化',cls:'optimize'}, urgent:{label:'紧急调整',cls:'urgent'},
  potential:{label:'潜力关键词',cls:'potential'}, inefficient:{label:'低效关键词',cls:'inefficient'}
};
const MATCH_TYPE_ZH = { 'EXACT':'精确','PHRASE':'短语','BROAD':'广泛','NEGATIVE_EXACT':'否定精确','NEGATIVE_PHRASE':'否定短语','NEGATIVE_BROAD':'否定广泛','asinSameAs':'商品','asinExpandedFrom':'商品拓展','asinCategorySameAs':'类目' };

let rawRows = [];
let portfolioTotals = new Map();
let overallCvr = 0;
let currentDim = 'keyword';
let sortState = { field:'clicks', dir:-1 };   // 默认点击量降序
let filterOptions = { portfolio:[], campaign:[], adGroup:[], targeting:[] };
let settings = { sampleClicks:10, redClicks:30, targetAcos:30, redAcos:45, darkMode:false };

const $ = id => document.getElementById(id);
function num(v){ const n = parseFloat(String(v).replace(/[,%$￥¥]/g,'')); return isNaN(n)?0:n; }
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* ============ 设置 & 暗黑模式 ============ */
function loadSettings(){
  try{ const s = JSON.parse(localStorage.getItem('adx_settings')||'{}'); settings = Object.assign({}, settings, s); }catch(e){}
  if(settings.darkMode) document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  $('darkSwitch').classList.toggle('on', settings.darkMode);
}
function saveSettings(){ localStorage.setItem('adx_settings', JSON.stringify(settings)); }

$('settingsBtn').onclick = () => {
  $('sSampleClicks').value = settings.sampleClicks;
  $('sRedClicks').value = settings.redClicks;
  $('sTargetAcos').value = settings.targetAcos;
  $('sRedAcos').value = settings.redAcos;
  $('darkSwitch').classList.toggle('on', settings.darkMode);
  $('settingsModal').classList.add('show');
};
$('settingsCancel').onclick = () => $('settingsModal').classList.remove('show');
$('settingsModal').addEventListener('click', e => { if(e.target === $('settingsModal')) $('settingsModal').classList.remove('show'); });
$('darkSwitch').onclick = () => { $('darkSwitch').classList.toggle('on'); };
$('settingsApply').onclick = () => {
  settings.sampleClicks = num($('sSampleClicks').value);
  settings.redClicks = num($('sRedClicks').value);
  settings.targetAcos = num($('sTargetAcos').value);
  settings.redAcos = num($('sRedAcos').value);
  settings.darkMode = $('darkSwitch').classList.contains('on');
  if(settings.darkMode) document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  saveSettings();
  $('settingsModal').classList.remove('show');
  if(rawRows.length) render();
};

/* ============ 上传 & 解析 ============ */
$('uploadZone').onclick = () => $('fileInput').click();
$('uploadZone').ondragover = e => { e.preventDefault(); };
$('uploadZone').ondrop = e => { e.preventDefault(); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
$('fileInput').addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(f){
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const wb = XLSX.read(ev.target.result, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
      parseRows(aoa);
      $('fileName').textContent = f.name;
      $('uploadZone').classList.add('has-file');
    }catch(err){ alert('解析失败：' + err.message); }
  };
  reader.readAsArrayBuffer(f);
}

function parseRows(aoa){
  if(!aoa.length) return alert('文件为空');
  const header = aoa[0].map(h => String(h).trim());
  const colMap = {};
  header.forEach((h,i) => { const nf = FIELD_MAP[normHeader(h)]; if(nf) colMap[nf] = i; });
  const required = ['keyword','impressions','clicks','spend','sales','units'];
  const missing = required.filter(k => colMap[k]===undefined);
  if(missing.length) return alert('缺少必要列：'+missing.join(', ')+'，请确认为「商品推广_搜索词_报告」格式');

  rawRows = [];
  for(let r=1;r<aoa.length;r++){
    const row = aoa[r];
    if(!row || row.every(v => String(v).trim()==='')) continue;
    const rec = {};
    for(const f in colMap) rec[f] = row[colMap[f]];
    if(rec.keyword===''||rec.keyword===undefined||rec.keyword===null) continue;
    rawRows.push(rec);
  }
  if(!rawRows.length) return alert('未解析到有效数据行');

  portfolioTotals = new Map();
  let tc=0, tu=0;
  for(const r of rawRows){
    const p = String(r.portfolio||'').trim() || '(未命名)';
    if(!portfolioTotals.has(p)) portfolioTotals.set(p, {clicks:0,units:0});
    const t = portfolioTotals.get(p);
    t.clicks += num(r.clicks); t.units += num(r.units);
    tc += num(r.clicks); tu += num(r.units);
  }
  overallCvr = tc>0 ? tu/tc*100 : 0;

  const sets = { portfolio:new Set(), campaign:new Set(), adGroup:new Set(), targeting:new Set() };
  for(const r of rawRows){
    if(r.portfolio) sets.portfolio.add(String(r.portfolio).trim());
    if(r.campaign) sets.campaign.add(String(r.campaign).trim());
    if(r.adGroup) sets.adGroup.add(String(r.adGroup).trim());
    if(r.targeting) sets.targeting.add(String(r.targeting).trim());
  }
  filterOptions = { portfolio:[...sets.portfolio].sort(), campaign:[...sets.campaign].sort(),
                    adGroup:[...sets.adGroup].sort(), targeting:[...sets.targeting].sort() };

  // 重置筛选
  ['fPortfolio','fCampaign','fAdGroup','fTargeting','fTag'].forEach(id => $(id).value = '');
  $('searchBox').value = '';
  buildFilterSelects();
  render();
}

function buildFilterSelects(){
  fillSelect($('fPortfolio'), filterOptions.portfolio);
  fillSelect($('fCampaign'), filterOptions.campaign);
  fillSelect($('fAdGroup'), filterOptions.adGroup);
  fillSelect($('fTargeting'), filterOptions.targeting);
  $('fTag').innerHTML = '<option value="">全部标签</option>' + Object.keys(TAG_META).map(k => '<option value="'+k+'">'+TAG_META[k].label+'</option>').join('');
}
function fillSelect(sel, arr){
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + arr.map(v => '<option value="'+escAttr(v)+'">'+v+'</option>').join('');
  sel.value = cur;
}

/* ============ 筛选级联 ============ */
function candidates(field, conds){
  let rows = rawRows;
  for(const [f,v] of conds) if(v) rows = rows.filter(r => String(r[f]||'').trim()===v);
  return [...new Set(rows.map(r => String(r[field]||'').trim()).filter(Boolean))].sort();
}
function refreshCascade(){
  const fp = $('fPortfolio').value, fc = $('fCampaign').value, fa = $('fAdGroup').value;
  fillSelect($('fCampaign'), candidates('campaign', [['portfolio',fp]]));
  fillSelect($('fAdGroup'), candidates('adGroup', [['portfolio',fp],['campaign',fc]]));
  fillSelect($('fTargeting'), candidates('targeting', [['portfolio',fp],['campaign',fc],['adGroup',fa]]));
}

function getFilteredRows(){
  let rows = rawRows;
  const fp = $('fPortfolio').value, fc = $('fCampaign').value, fa = $('fAdGroup').value, ft = $('fTargeting').value;
  if(fp) rows = rows.filter(r => String(r.portfolio||'').trim() === fp);
  if(fc) rows = rows.filter(r => String(r.campaign||'').trim() === fc);
  if(fa) rows = rows.filter(r => String(r.adGroup||'').trim() === fa);
  if(ft) rows = rows.filter(r => String(r.targeting||'').trim() === ft);
  return rows;
}

/* ============ 聚合 & 计算 ============ */
function aggregate(rows, field){
  const map = new Map();
  for(const r of rows){
    const key = String(r[field]||'').trim() || '(未命名)';
    if(!map.has(key)) map.set(key, { key, impressions:0,clicks:0,spend:0,sales:0,units:0,orders:0, matchTypes:new Set(), portfolios:new Set(), rows:0 });
    const g = map.get(key);
    g.impressions += num(r.impressions); g.clicks += num(r.clicks); g.spend += num(r.spend);
    g.sales += num(r.sales); g.units += num(r.units); g.orders += num(r.orders); g.rows++;
    if(r.matchType) g.matchTypes.add(String(r.matchType).trim().toUpperCase());
    if(r.portfolio) g.portfolios.add(String(r.portfolio).trim());
  }
  return Array.from(map.values());
}

function compute(g){
  g.ctr = g.impressions>0 ? g.clicks/g.impressions*100 : 0;
  g.cpc = g.clicks>0 ? g.spend/g.clicks : 0;
  g.cvr = g.clicks>0 ? g.units/g.clicks*100 : 0;
  g.acos = g.sales>0 ? g.spend/g.sales*100 : 0;
  g.roas = g.spend>0 ? g.sales/g.spend : 0;
  g.price = g.units>0 ? g.sales/g.units : 0;
  return g;
}
function groupCvr(g){
  let c=0, u=0;
  for(const p of g.portfolios){
    const t = portfolioTotals.get(p);
    if(t){ c+=t.clicks; u+=t.units; }
  }
  if(c===0 && u===0) return overallCvr;
  return c>0 ? u/c*100 : 0;
}

/* ============ 标签引擎 ============ */
function tag(g, dimKey){
  const sc = settings.sampleClicks, rc = settings.redClicks, ta = settings.targetAcos, ra = settings.redAcos;
  const isKw = dimKey==='keyword';
  const tags = [];
  const zeroConversion = (g.sales===0 && g.spend>0);
  if(g.clicks < sc){
    tags.push('insufficient');
    if(isKw && g.cvr > groupCvr(g)) tags.push('potential');
  } else {
    if(zeroConversion) tags.push('urgent');
    else if(g.acos < ta) tags.push('excellent');
    else if(g.acos < ra) tags.push('optimize');
    else tags.push('urgent');
    if(isKw && g.clicks >= rc && (g.acos >= ra || zeroConversion)) tags.push('inefficient');
  }
  return tags;
}

/* ============ 建议引擎（搜索词 + 投放） ============ */
function advice(g, tags, dimKey){
  if(dimKey !== 'keyword' && dimKey !== 'targeting') return '';
  const sc = settings.sampleClicks, ta = settings.targetAcos, ra = settings.redAcos;
  const cvr = g.cvr, price = g.price;
  const hasExact = [...g.matchTypes].some(m => m.includes('EXACT'));
  const raiseCpc = () => price>0 && cvr>0 ? (ra/100*cvr/100*price).toFixed(2) : null;
  const lowerCpc = () => price>0 && cvr>0 ? (ta/100*cvr/100*price).toFixed(2) : null;
  const raisePrice = () => cvr>0 && g.cpc>0 ? (g.cpc/(ta/100*cvr/100)).toFixed(2) : null;
  if(tags.includes('urgent')){
    const l = lowerCpc();
    return '先判断是否强相关属性词：不是→否词；是→' + (l ? ('降低竞价（极限值 '+l+'）或调整页面') : '调整页面');
  }
  if(tags.includes('inefficient')) return '先判断是否强相关属性词：不是→否词；是→调整页面';
  if(tags.includes('optimize')){
    const p = raisePrice(), c = lowerCpc(), parts = [];
    if(p) parts.push('① 涨价：提高售价，极限值 '+p);
    if(c) parts.push('② 降低竞价，极限值 '+c);
    parts.push('③ 继续观察');
    return parts.join('；');
  }
  if(tags.includes('potential')){
    if(hasExact){ const l = raiseCpc(); return '建议提高竞价' + (l ? ('，极限值 '+l) : ''); }
    return '建议为该词单独开 EXACT 活动：建议竞价 '+g.cpc.toFixed(2)+'，建议预算 '+Math.ceil(g.cpc*sc);
  }
  if(tags.includes('insufficient')) return '等待数据积累';
  return '';
}

/* ============ 列定义（动态） ============ */
function getCols(){
  const dim = DIMENSIONS.find(d => d.key===currentDim);
  return [
    { label: dim.label, field: '_key', csv: g => cleanKw(g.key) },
    { label: '匹配类型', field: 'matchType', csv: g => matchTypeZh(g) },
    { label: '展示量', field: 'impressions', csv: g => g.impressions },
    { label: '点击量', field: 'clicks', csv: g => g.clicks },
    { label: '点击率', field: 'ctr', csv: g => g.ctr.toFixed(2) },
    { label: '花费', field: 'spend', csv: g => g.spend.toFixed(2) },
    { label: 'CPC', field: 'cpc', csv: g => g.cpc.toFixed(2) },
    { label: '销售额', field: 'sales', csv: g => g.sales.toFixed(2) },
    { label: '销量', field: 'units', csv: g => g.units },
    { label: '转化率', field: 'cvr', csv: g => g.cvr.toFixed(2) },
    { label: 'ACOS', field: 'acos', csv: g => g.acos.toFixed(2) },
    { label: 'ROAS', field: 'roas', csv: g => g.roas.toFixed(2) }
  ];
}

/* ============ 渲染 ============ */
function render(){
  const dim = DIMENSIONS.find(d => d.key===currentDim);
  const rows = getFilteredRows();
  let groups = aggregate(rows, dim.field).map(compute);
  groups.forEach(g => { g.tags = tag(g, currentDim); g.advice = advice(g, g.tags, currentDim); });

  const ft = $('fTag').value;
  const kw = $('searchBox').value.trim().toLowerCase();
  const displayGroups = groups.filter(g => {
    if(ft && !g.tags.includes(ft)) return false;
    if(kw && !g.key.toLowerCase().includes(kw)) return false;
    return true;
  });

  $('overviewPanel').style.display = 'block';
  $('detailPanel').style.display = 'block';
  $('exportBtn').disabled = false;
  renderKpi(displayGroups);
  renderTabs();
  renderTable(displayGroups);
}

function renderKpi(groups){
  const t = groups.reduce((a,g) => {
    a.spend+=g.spend; a.sales+=g.sales; a.clicks+=g.clicks; a.units+=g.units; a.impressions+=g.impressions;
    return a;
  }, {spend:0,sales:0,clicks:0,units:0,impressions:0});
  const cvr = t.clicks>0 ? t.units/t.clicks*100 : 0;
  const acos = t.sales>0 ? t.spend/t.sales*100 : 0;
  const items = [
    { label:'总销售额', val:'$'+t.sales.toFixed(2) },
    { label:'总花费', val:'$'+t.spend.toFixed(2) },
    { label:'总点击', val:''+t.clicks },
    { label:'总销量', val:''+t.units },
    { label:'转化率', val:cvr.toFixed(2)+'%' },
    { label:'ACOS', val:acos.toFixed(2)+'%' }
  ];
  $('kpiBox').innerHTML = items.map((it,i) =>
    '<div class="kpi-item c'+i+'"><div class="label">'+it.label+'</div><div class="val">'+it.val+'</div></div>'
  ).join('');
}

function renderTabs(){
  $('tabs').innerHTML = DIMENSIONS.map(d =>
    '<div class="tab'+(d.key===currentDim?' active':'')+'" data-dim="'+d.key+'">'+d.label+'</div>'
  ).join('');
  $('tabs').querySelectorAll('.tab').forEach(t => t.onclick = () => { currentDim = t.dataset.dim; sortState = {field:'clicks',dir:-1}; render(); });
}

function fmtNum(v){ return Number(v).toFixed(2); }
function fmtPct(v){ return Number(v).toFixed(2)+'%'; }
function tagsHtml(g){ return g.tags.map(t => '<span class="tag tag-'+TAG_META[t].cls+'">'+TAG_META[t].label+'</span>').join(''); }

function cellHtml(g, field){
  switch(field){
    case '_key': {
      const withAdvice = (currentDim==='keyword' || currentDim==='targeting');
      const tags = tagsHtml(g);
      const adv = (withAdvice && g.advice) ? g.advice : '';
      return '<td class="kw">' +
        '<div class="kw-name clamp1" title="'+escAttr(cleanKw(g.key))+'">'+cleanKw(g.key)+'</div>' +
        (tags ? '<div class="kw-tags">'+tags+'</div>' : '') +
        (withAdvice ? '<div class="kw-advice clamp2"'+(adv?' title="'+escAttr(adv)+'"':'')+'>'+adv+'</div>' : '') +
        '</td>';
    }
    case 'matchType': return '<td class="mt">'+matchTypeZh(g)+'</td>';
    case 'impressions': return '<td class="num">'+g.impressions+'</td>';
    case 'clicks': return '<td class="num">'+g.clicks+'</td>';
    case 'ctr': return '<td class="num">'+fmtPct(g.ctr)+'</td>';
    case 'spend': return '<td class="num">'+fmtNum(g.spend)+'</td>';
    case 'cpc': return '<td class="num">'+fmtNum(g.cpc)+'</td>';
    case 'sales': return '<td class="num">'+fmtNum(g.sales)+'</td>';
    case 'units': return '<td class="num">'+g.units+'</td>';
    case 'cvr': return '<td class="num">'+fmtPct(g.cvr)+'</td>';
    case 'acos': return '<td class="num">'+(g.acos>0?fmtPct(g.acos):'—')+'</td>';
    case 'roas': return '<td class="num">'+(g.roas>0?fmtNum(g.roas):'—')+'</td>';
  }
  return '<td></td>';
}
function sortVal(g, field){
  if(field==='tags') return g.tags.join(',');
  if(field==='matchType') return matchTypeZh(g);
  if(field==='advice') return g.advice||'';
  return g[field];
}

function renderTable(groups){
  const cols = getCols();

  $('thead').innerHTML = '<tr>' + cols.map((c,i) =>
    '<th data-i="'+i+'">'+c.label+(sortState.field===c.field?' <span class="arrow">'+(sortState.dir===1?'▲':'▼')+'</span>':'')+'</th>'
  ).join('') + '</tr>';
  $('thead').querySelectorAll('th').forEach(th => th.onclick = () => {
    const f = cols[+th.dataset.i].field;
    if(!f || f==='_key') return;
    if(sortState.field===f) sortState.dir = -sortState.dir;
    else sortState = { field:f, dir:-1 };
    renderTable(groups);
  });

  const sf = sortState.field;
  let list = groups;
  if(sf && sf!=='_key'){
    list = groups.slice().sort((a,b) => {
      const va = sortVal(a,sf), vb = sortVal(b,sf);
      if(typeof va==='number' && typeof vb==='number') return (va-vb)*sortState.dir;
      return String(va).localeCompare(String(vb))*sortState.dir;
    });
  }

  $('rowCount').textContent = '共 '+list.length+' 条';
  $('tbody').innerHTML = list.length
    ? list.map(g => '<tr>' + cols.map(c => cellHtml(g, c.field)).join('') + '</tr>').join('')
    : '<tr><td colspan="'+cols.length+'" class="empty">无匹配数据</td></tr>';
}

function cleanKw(k){ return String(k).replace(/^"+|"+$/g,'').trim(); }
function matchTypeZh(g){ const a = [...g.matchTypes].map(m => MATCH_TYPE_ZH[m]||m); return a.length ? a.join('、') : '—'; }

/* ============ 事件 ============ */
['fPortfolio','fCampaign','fAdGroup','fTargeting'].forEach(id => $(id).addEventListener('change', () => { refreshCascade(); render(); }));
$('fTag').addEventListener('change', () => render());
$('searchBox').addEventListener('input', () => render());

/* ============ 导出 ============ */
$('exportBtn').addEventListener('click', () => {
  const dim = DIMENSIONS.find(d => d.key===currentDim);
  const cols = getCols();
  const rows = getFilteredRows();
  let groups = aggregate(rows, dim.field).map(compute);
  groups.forEach(g => { g.tags = tag(g, currentDim); g.advice = advice(g, g.tags, currentDim); });
  const ft = $('fTag').value, kw = $('searchBox').value.trim().toLowerCase();
  const list = groups.filter(g => (!ft || g.tags.includes(ft)) && (!kw || g.key.toLowerCase().includes(kw)));

  const lines = [cols.map(c => c.label).join(',')];
  const esc = v => { v = String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  list.forEach(g => lines.push(cols.map(c => esc(c.csv(g))).join(',')));
  const blob = new Blob(['\ufeff'+lines.join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = '广告诊断_'+dim.label+'.csv'; a.click();
  URL.revokeObjectURL(a.href);
});

loadSettings();
</script>
